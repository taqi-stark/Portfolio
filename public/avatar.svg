<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="beanieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#718096"/>
      <stop offset="100%" stop-color="#4a5568"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>
  
  <!-- Subtle landscape horizon lines -->
  <path d="M0 260 Q100 240 200 255 T400 245 L400 400 L0 400 Z" fill="#2d3748" opacity="0.3"/>
  <path d="M0 290 Q120 270 240 285 T400 275 L400 400 L0 400 Z" fill="#1a202c" opacity="0.5"/>

  <!-- Neck -->
  <rect x="180" y="220" width="40" height="50" rx="10" fill="#cbd5e1"/>
  
  <!-- Jacket & Shoulders -->
  <path d="M110 370 Q140 260 180 250 L220 250 Q260 260 290 370 Q200 400 110 370 Z" fill="url(#jacketGrad)"/>
  <path d="M180 250 L200 290 L220 250 Z" fill="#e2e8f0"/>
  <path d="M196 280 L204 280 L204 360 L196 360 Z" fill="#4a5568"/>

  <!-- Head / Face -->
  <ellipse cx="200" cy="180" rx="46" ry="54" fill="url(#faceGrad)"/>
  
  <!-- Eyes -->
  <ellipse cx="184" cy="175" rx="5" ry="3.5" fill="#2d3748"/>
  <ellipse cx="216" cy="175" rx="5" ry="3.5" fill="#2d3748"/>
  <circle cx="185" cy="174" r="1.5" fill="#ffffff"/>
  <circle cx="217" cy="174" r="1.5" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M176 166 Q185 162 194 166" stroke="#4a5568" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M206 166 Q215 162 224 166" stroke="#4a5568" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M200 174 L197 192 L204 193" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Smile -->
  <path d="M186 206 Q200 218 214 206" stroke="#2d3748" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Ears -->
  <ellipse cx="152" cy="180" rx="6" ry="12" fill="#cbd5e1"/>
  <ellipse cx="248" cy="180" rx="6" ry="12" fill="#cbd5e1"/>

  <!-- Beanie -->
  <path d="M152 165 C152 110 248 110 248 165 C248 172 152 172 152 165 Z" fill="url(#beanieGrad)"/>
  <path d="M148 160 Q200 156 252 160 Q252 172 200 170 Q148 172 148 160 Z" fill="#4a5568"/>
  <!-- Beanie knit texture lines -->
  <line x1="170" y1="125" x2="170" y2="160" stroke="#718096" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="185" y1="120" x2="185" y2="160" stroke="#718096" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="200" y1="118" x2="200" y2="160" stroke="#718096" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="215" y1="120" x2="215" y2="160" stroke="#718096" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="230" y1="125" x2="230" y2="160" stroke="#718096" stroke-width="1.5" stroke-linecap="round"/>
</svg>
