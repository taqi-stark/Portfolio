<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#718096"/>
      <stop offset="40%" stop-color="#a0aec0"/>
      <stop offset="70%" stop-color="#cbd5e0"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="portJacket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#171923"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="500" height="620" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <path d="M40 120 Q120 100 200 115 T360 110 T500 130 L500 240 L0 240 Z" fill="#edf2f7" opacity="0.35"/>
  <path d="M0 160 Q140 140 280 155 T500 145 L500 280 L0 280 Z" fill="#edf2f7" opacity="0.45"/>

  <!-- Bare Tree in Background (matching Image 2) -->
  <g opacity="0.4" stroke="#2d3748" stroke-linecap="round">
    <!-- Trunk -->
    <path d="M120 380 Q125 280 135 200 Q140 150 145 110" stroke-width="12" fill="none"/>
    <!-- Main branches -->
    <path d="M135 220 Q105 180 80 150" stroke-width="6" fill="none"/>
    <path d="M137 200 Q170 170 200 140" stroke-width="6" fill="none"/>
    <path d="M142 160 Q120 130 95 100" stroke-width="4.5" fill="none"/>
    <path d="M144 140 Q160 110 175 80" stroke-width="4.5" fill="none"/>
    <!-- Fine twigs -->
    <path d="M80 150 Q60 130 50 110 M80 150 Q75 120 70 95" stroke-width="2.5" fill="none"/>
    <path d="M200 140 Q220 120 230 100 M200 140 Q210 110 215 85" stroke-width="2.5" fill="none"/>
    <path d="M95 100 Q80 80 75 60 M95 100 Q100 70 105 50" stroke-width="2" fill="none"/>
    <path d="M175 80 Q190 60 195 40 M175 80 Q165 50 160 30" stroke-width="2" fill="none"/>
    <path d="M145 110 Q145 70 140 40 M145 110 Q155 70 160 40" stroke-width="3" fill="none"/>
  </g>

  <!-- Distant field & fence -->
  <path d="M0 320 Q250 310 500 325 L500 420 L0 420 Z" fill="#a0aec0" opacity="0.6"/>
  <!-- Fence line -->
  <line x1="0" y1="340" x2="500" y2="340" stroke="#718096" stroke-width="2.5" opacity="0.6"/>
  <line x1="0" y1="355" x2="500" y2="355" stroke="#718096" stroke-width="2.5" opacity="0.6"/>
  <line x1="50" y1="330" x2="50" y2="370" stroke="#718096" stroke-width="3.5" opacity="0.6"/>
  <line x1="150" y1="330" x2="150" y2="370" stroke="#718096" stroke-width="3.5" opacity="0.6"/>
  <line x1="380" y1="330" x2="380" y2="370" stroke="#718096" stroke-width="3.5" opacity="0.6"/>
  <line x1="460" y1="330" x2="460" y2="370" stroke="#718096" stroke-width="3.5" opacity="0.6"/>

  <!-- Foreground ground -->
  <path d="M0 370 Q250 360 500 370 L500 620 L0 620 Z" fill="url(#groundGrad)"/>

  <!-- Engineer (Ali Taqi) -->
  <!-- Legs / Jeans -->
  <path d="M160 530 L170 620 L215 620 L205 530 Z" fill="#4a5568"/>
  <path d="M225 530 L220 620 L265 620 L270 530 Z" fill="#4a5568"/>

  <!-- Jacket Body -->
  <path d="M125 360 C125 310 170 300 215 300 C260 300 305 310 305 360 L310 540 C280 550 150 550 120 540 Z" fill="url(#portJacket)"/>
  
  <!-- Jacket Collar & Details -->
  <path d="M190 300 L215 345 L240 300 Z" fill="#e2e8f0"/>
  <path d="M165 305 L215 335 L265 305" stroke="#171923" stroke-width="4" fill="none"/>
  <!-- Front placket -->
  <line x1="215" y1="345" x2="215" y2="540" stroke="#171923" stroke-width="3"/>
  <!-- Pocket flaps -->
  <rect x="145" y="380" width="45" height="35" rx="3" fill="#1f2430" stroke="#171923" stroke-width="1.5"/>
  <rect x="240" y="380" width="45" height="35" rx="3" fill="#1f2430" stroke="#171923" stroke-width="1.5"/>

  <!-- Hands in pockets -->
  <ellipse cx="130" cy="510" rx="14" ry="20" fill="#2d3748"/>
  <ellipse cx="298" cy="510" rx="14" ry="20" fill="#2d3748"/>

  <!-- Neck -->
  <rect x="195" y="275" width="40" height="35" rx="6" fill="#cbd5e1"/>

  <!-- Head / Face -->
  <ellipse cx="215" cy="235" rx="42" ry="48" fill="#e2e8f0"/>

  <!-- Eyes and smile -->
  <ellipse cx="201" cy="230" rx="4.5" ry="3.5" fill="#2d3748"/>
  <ellipse cx="229" cy="230" rx="4.5" ry="3.5" fill="#2d3748"/>
  <circle cx="202" cy="229" r="1.5" fill="#ffffff"/>
  <circle cx="230" cy="229" r="1.5" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M194 221 Q202 218 210 221" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M220 221 Q228 218 236 221" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M215 229 L213 244 L219 245" stroke="#a0aec0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Warm Broad Smile -->
  <path d="M202 255 Q215 268 228 255" stroke="#2d3748" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Ears -->
  <ellipse cx="171" cy="235" rx="5" ry="10" fill="#cbd5e1"/>
  <ellipse cx="259" cy="235" rx="5" ry="10" fill="#cbd5e1"/>

  <!-- Beanie Cap (folded brim, ribbed) -->
  <path d="M172 222 C172 170 258 170 258 222 C258 228 172 228 172 222 Z" fill="#718096"/>
  <path d="M168 218 Q215 214 262 218 Q262 228 215 226 Q168 228 168 218 Z" fill="#4a5568"/>
  <line x1="188" y1="186" x2="188" y2="218" stroke="#a0aec0" stroke-width="1.5"/>
  <line x1="202" y1="180" x2="202" y2="218" stroke="#a0aec0" stroke-width="1.5"/>
  <line x1="215" y1="178" x2="215" y2="218" stroke="#a0aec0" stroke-width="1.5"/>
  <line x1="228" y1="180" x2="228" y2="218" stroke="#a0aec0" stroke-width="1.5"/>
  <line x1="242" y1="186" x2="242" y2="218" stroke="#a0aec0" stroke-width="1.5"/>
</svg>
